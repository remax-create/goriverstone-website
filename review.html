<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Blog Review | Riverstone Homes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: matches the main site. Forest header band, then a limestone reading column with a full-width photo per post */
:root {
  --page: #f4f3ef; --page-2: #eae8e2; --card: #ffffff; --ink: #18211e; --ink-2: #505a55; --line: #d9d7cf;
  --forest: #1b2823; --forest-2: #24342d; --brass: #9c7a45; --brass-hi: #c5a46f;
  --on-dark: #f2f0ea; --on-dark-2: rgba(242,240,234,.72); --on-dark-line: rgba(242,240,234,.16);
  --notice: #fbf3e2; --notice-ink: #6b4e1e;
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Hanken Grotesk", "Helvetica Neue", system-ui, sans-serif;
  --gl: max(20px, env(safe-area-inset-left, 0px)); --gr: max(20px, env(safe-area-inset-right, 0px));
  --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #111714; --page-2: #18201c; --card: #1c2420; --ink: #ecebe6; --ink-2: #a9b2ac; --line: #2c3631;
    --forest: #0b100e; --forest-2: #141c18; --brass: #c9a66c; --brass-hi: #dcbd88; --notice: #2a2416; --notice-ink: #e6cf9f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #111714; --page-2: #18201c; --card: #1c2420; --ink: #ecebe6; --ink-2: #a9b2ac; --line: #2c3631;
  --forest: #0b100e; --forest-2: #141c18; --brass: #c9a66c; --brass-hi: #dcbd88; --notice: #2a2416; --notice-ink: #e6cf9f;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { background: var(--page); color: var(--ink); font: 400 1.0625rem/1.7 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--forest); }
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.1; letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 4px; }
.wrap { max-width: 1240px; margin-inline: auto; padding-left: var(--gl); padding-right: var(--gr); }
.narrow { max-width: calc(720px + 40px); }
.label { display: inline-flex; align-items: center; gap: .75rem; font: 600 .75rem/1 var(--f-body); letter-spacing: .22em; text-transform: uppercase; color: var(--brass); }
.label::before { content: ""; width: 28px; height: 1px; background: currentColor; }

/* Header */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--forest); color: var(--on-dark); }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; height: 72px; }
.brand img { height: 34px; width: auto; filter: invert(1); }
.head-links { display: flex; gap: 1.5rem; align-items: center; }
.head-links a { text-decoration: none; font: 500 .9rem/1 var(--f-body); letter-spacing: .04em; }
.head-links .cta { border: 1px solid currentColor; padding: .7rem 1rem; font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.head-links .cta:hover { background: var(--brass-hi); border-color: var(--brass-hi); color: #18211e; }
@media (max-width: 520px) { .head-links .home { display: none; } }

/* Review banner (review copy only) */
.review-bar { background: var(--notice); color: var(--notice-ink); border-bottom: 1px solid var(--line); }
.review-bar .wrap { padding-block: .9rem; display: flex; flex-wrap: wrap; gap: .4rem 1rem; align-items: baseline; font-size: .95rem; }
.review-bar b { font-weight: 600; }

/* Blog index */
.masthead { padding-block: clamp(3.5rem, 8vw, 6rem) clamp(2rem, 4vw, 3rem); border-bottom: 1px solid var(--line); }
.masthead .wrap { display: grid; gap: 1.25rem; }
.masthead h1 { font-size: clamp(2.4rem, 5vw, 4rem); }
.masthead p { color: var(--ink-2); max-width: 58ch; font-size: 1.15rem; margin: 0; }
.posts { padding-block: clamp(2.5rem, 6vw, 4.5rem); display: grid; gap: clamp(2.5rem, 5vw, 3.5rem); }
.post-card { display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(1.5rem, 4vw, 3rem); text-decoration: none; align-items: center; }
.post-card > * { min-width: 0; }
.post-card .ph { overflow: hidden; background: var(--page-2); }
.post-card img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; transition: transform 1s var(--ease); }
.post-card:hover img { transform: scale(1.04); }
.post-card .txt { display: grid; gap: .9rem; }
.post-card h2 { font-size: clamp(1.6rem, 2.8vw, 2.25rem); }
.post-card:hover h2 { color: var(--brass); }
.post-card p { margin: 0; color: var(--ink-2); }
.meta { font-size: .85rem; letter-spacing: .04em; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: .35rem .9rem; }
.meta .cat { color: var(--brass); font-weight: 600; letter-spacing: .16em; text-transform: uppercase; font-size: .72rem; }
@media (max-width: 760px) { .post-card { grid-template-columns: 1fr; } }
.empty { padding-block: 4rem; color: var(--ink-2); }

/* Article */
.article-head { padding-block: clamp(3rem, 7vw, 5rem) 2rem; }
.article-head .wrap { display: grid; gap: 1.25rem; }
.article-head h1 { font-size: clamp(2.1rem, 4.6vw, 3.4rem); }
.article-head .dek { color: var(--ink-2); font-size: 1.2rem; line-height: 1.6; margin: 0; }
.byline { display: flex; align-items: center; gap: .9rem; padding-top: .5rem; }
.byline .mono { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--forest); color: var(--brass-hi); font: italic 400 1.1rem/1 var(--f-display); flex: none; }
.byline b { display: block; font-weight: 600; }
.byline span { color: var(--ink-2); font-size: .9rem; }
figure.hero-ph { margin: 0 0 clamp(2rem, 5vw, 3.5rem); }
figure.hero-ph img { width: 100%; max-height: 640px; aspect-ratio: 16 / 9; object-fit: cover; }
figure.hero-ph figcaption { color: var(--ink-2); font-size: .85rem; padding-top: .6rem; }
.prose { display: grid; gap: 1.25rem; padding-bottom: 3rem; }
.prose p, .prose li { max-width: 68ch; }
.prose p { margin: 0; }
.prose h2 { font-size: clamp(1.5rem, 2.6vw, 1.95rem); margin-top: 1.25rem; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3rem; display: grid; gap: .55rem; }
.prose ol li::marker { color: var(--brass); font-family: var(--f-display); }
.prose ul li::marker { color: var(--brass); }
.prose strong { font-weight: 600; }
.prose .fine { font-size: .88rem; color: var(--ink-2); }
.table-wrap { overflow-x: auto; border-top: 1px solid var(--ink); }
.prose table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 440px; }
.prose th { text-align: left; font: 600 .72rem/1.3 var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); padding: .9rem .75rem .9rem 0; border-bottom: 1px solid var(--line); }
.prose td { padding: .85rem .75rem .85rem 0; border-bottom: 1px solid var(--line); }
.prose td:last-child { color: var(--brass); font-weight: 600; }
.sources { border-top: 1px solid var(--line); padding-block: 1.5rem 3rem; display: grid; gap: .6rem; }
.sources h3 { font: 600 .72rem/1 var(--f-body); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
.sources ul { margin: 0; padding: 0; list-style: none; display: grid; gap: .4rem; font-size: .92rem; }
.sources a { color: var(--ink-2); }
.sources a:hover { color: var(--brass); }

/* CTA band */
.cta-band { background: var(--forest); color: var(--on-dark); }
.cta-band .wrap { padding-block: clamp(3rem, 7vw, 4.5rem); display: flex; flex-wrap: wrap; gap: 1.5rem 3rem; align-items: center; justify-content: space-between; }
.cta-band h2 { font-size: clamp(1.7rem, 3vw, 2.4rem); max-width: 22ch; }
.cta-band p { color: var(--on-dark-2); margin: .6rem 0 0; }
.btn { display: inline-flex; align-items: center; gap: .8rem; padding: 1rem 1.5rem; font: 600 .85rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; text-decoration: none; background: var(--on-dark); color: #18211e; border: 1px solid var(--on-dark); }
.btn:hover { background: var(--brass-hi); border-color: var(--brass-hi); }
.back { display: inline-flex; gap: .5rem; align-items: center; font: 600 .78rem/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; color: var(--brass); }
.back:hover { color: var(--ink); }
.decide { border: 1px solid var(--line); background: var(--card); padding: 1.5rem; display: grid; gap: 1rem; margin-bottom: 3rem; }
.decide h3 { font: 600 .78rem/1 var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--brass); }
.decide p { margin: 0; color: var(--ink-2); }
.decide textarea { font: inherit; width: 100%; min-height: 96px; padding: .75rem; border: 1px solid var(--line); background: var(--page); color: var(--ink); resize: vertical; }
.decide .row { display: flex; flex-wrap: wrap; gap: .75rem; }
.decide button { font: 600 .82rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: .95rem 1.3rem; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--page); }
.decide button.alt { background: transparent; color: var(--ink); }
.decide button:hover { background: var(--brass); border-color: var(--brass); color: #fff; }
.decide button:disabled { opacity: .5; cursor: default; }
.decide .status { font-weight: 600; color: var(--ink); }
.decide .status:empty { display: none; }
.gate { max-width: 420px; margin: clamp(3rem,10vw,6rem) auto; padding: 2rem; background: var(--card); border: 1px solid var(--line); display: grid; gap: 1rem; }
.gate h1 { font-size: 2rem; }
.gate input { font: inherit; padding: .8rem; border: 1px solid var(--line); background: var(--page); color: var(--ink); width: 100%; }
.gate button, .done a.btn2 { font: 600 .82rem/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: .95rem 1.3rem; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--page); text-decoration: none; display: inline-block; }
.gate .err { color: #a33; margin: 0; min-height: 1.2em; }
.queue { display: flex; flex-wrap: wrap; gap: .5rem; padding-top: 1rem; }
.queue a { font-size: .85rem; padding: .45rem .8rem; border: 1px solid var(--line); text-decoration: none; background: var(--card); }
.queue a.on { border-color: var(--brass); color: var(--brass); }
.decide.done { border-color: var(--brass); }
.site-footer { background: var(--forest); color: var(--on-dark-2); border-top: 1px solid var(--on-dark-line); }
.site-footer .wrap { padding-block: 1.75rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: .75rem; font-size: .88rem; }
.site-footer a { color: var(--on-dark); text-decoration: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Riverstone Homes home"><img src="images/logo.png" alt="Riverstone Homes" width="799" height="238"></a>
    <nav class="head-links" aria-label="Review">
      <a class="home" href="/">Home</a>
      <a href="blog.html">Live blog</a>
      <a href="#" id="signout">Sign out</a>
    </nav>
  </div>
</header>
<div class="review-bar" id="review-bar" hidden>
  <div class="wrap"><b>Drafts for approval.</b><span>Only you can see this page. Click Approve and the post goes live on the blog right away.</span></div>
</div>
<main id="view"><p class="wrap empty">Loading…</p></main>
<footer class="site-footer">
  <div class="wrap"><span>Riverstone Homes blog review · private</span><a href="/">goriverstone.com</a></div>
</footer>
<script>
  const API = "/api/blog";
  const view = document.getElementById("view");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  const initials = name => String(name || "").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  const store = { get(){ try { return localStorage.getItem("rs-review-key") || ""; } catch { return ""; } }, set(v){ try { v ? localStorage.setItem("rs-review-key", v) : localStorage.removeItem("rs-review-key"); } catch {} } };
  let key = store.get(), state = { drafts: {}, decisions: {} };

  async function api(method, body) {
    const r = await fetch(API + (method === "GET" ? "?view=review" : ""), {
      method, cache: "no-store",
      headers: { "content-type": "application/json", "x-review-key": key },
      body: body ? JSON.stringify(body) : undefined
    });
    if (r.status === 401) throw Object.assign(new Error("auth"), { auth: true });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || r.status);
    return d;
  }

  function gate(msg) {
    document.getElementById("review-bar").hidden = true;
    view.innerHTML = `<form class="gate" id="gate">
      <h1>Blog review</h1>
      <p>Enter the review password. This browser will remember it.</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required>
      <button type="submit">Open drafts</button>
      <p class="err" role="alert">${esc(msg || "")}</p>
    </form>`;
    document.getElementById("pw").focus();
    document.getElementById("gate").addEventListener("submit", async e => {
      e.preventDefault();
      key = document.getElementById("pw").value.trim().toLowerCase();
      e.submitter && (e.submitter.disabled = true);
      try { await api("POST", { action: "check" }); store.set(key); load(); }
      catch (err) { key = ""; gate(err.auth ? "That password didn't work. Try again." : "Couldn't connect. Check your internet and try again."); }
    });
  }

  async function load() {
    if (!key) return gate();
    try { state = await api("GET"); }
    catch (err) { if (err.auth) { store.set(""); key = ""; return gate("Please sign in again."); } view.innerHTML = '<p class="wrap empty">Couldn\'t load drafts. Refresh the page to try again.</p>'; return; }
    document.getElementById("review-bar").hidden = false;
    route();
  }

  const list = () => Object.values(state.drafts).sort((a, b) => String(b.date).localeCompare(String(a.date)));

  function route() {
    const posts = list();
    if (!posts.length) { view.innerHTML = '<div class="wrap empty"><p>No drafts waiting. New posts arrive Monday and Thursday mornings.</p><p><a href="blog.html">See the live blog</a></p></div>'; return; }
    const slug = location.hash.replace(/^#/, "");
    renderPost(posts.find(p => p.slug === slug) || posts[0], posts);
  }

  function statusText(p) {
    const d = state.decisions[p.slug];
    if (!d || d.rev !== p.rev) return "";
    return d.decision === "approved"
      ? `Approved. It's live on the blog now. <a href="blog.html#${esc(p.slug)}" target="_blank" rel="noopener">See it</a>`
      : "Changes requested. Claude will send a new draft.";
  }

  function renderPost(p, posts) {
    const d = state.decisions[p.slug];
    const current = d && d.rev === p.rev;
    view.innerHTML = `
      <article>
        <header class="article-head"><div class="wrap narrow">
          ${posts.length > 1 ? `<nav class="queue" aria-label="Drafts">${posts.map(x => `<a href="#${esc(x.slug)}" class="${x.slug === p.slug ? "on" : ""}">${esc(x.title)}</a>`).join("")}</nav>` : ""}
          <div class="meta"><span class="cat">${esc(p.category)}</span><span>Draft · ${fmtDate(p.date)}</span><span>${esc(p.readMins)} min read</span></div>
          <h1>${esc(p.title)}</h1>
          <p class="dek">${esc(p.excerpt)}</p>
          <div class="byline"><div class="mono" aria-hidden="true">${esc(initials(p.author))}</div><div><b>${esc(p.author)}</b><span>${esc(p.authorRole)}</span></div></div>
        </div></header>
        <div class="wrap narrow">
          <figure class="hero-ph"><img src="${esc(p.photo)}" alt="${esc(p.photoAlt)}" width="1600" height="1067">${p.photoCaption ? `<figcaption>${esc(p.photoCaption)}</figcaption>` : ""}</figure>
          <div class="prose">${p.body}</div>
          ${p.sources && p.sources.length ? `<div class="sources"><h3>Sources</h3><ul>${p.sources.map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a></li>`).join("")}</ul></div>` : ""}
          <section class="decide ${current && d.decision === "approved" ? "done" : ""}" id="decide">
            <h3>Your call</h3>
            <p>Approve and it goes live on the Riverstone blog right away. Want changes? Say what to fix and Claude will rewrite it.</p>
            <label for="note" style="font-size:.85rem;color:var(--ink-2)">Notes for Claude (optional for approval)</label>
            <textarea id="note" placeholder="Example: shorten the intro, use a kitchen photo instead">${esc(current ? d.note : "")}</textarea>
            <div class="row"><button id="approve" type="button">Approve post</button><button id="changes" type="button" class="alt">Request changes</button></div>
            <p class="status" id="decide-status" role="status">${statusText(p)}</p>
          </section>
        </div>
      </article>`;
    window.scrollTo(0, 0);
    const box = document.getElementById("decide"), status = document.getElementById("decide-status"), note = document.getElementById("note");
    const save = async action => {
      if (action === "changes" && !note.value.trim()) { status.textContent = "Add a note so Claude knows what to change."; note.focus(); return; }
      box.querySelectorAll("button").forEach(b => b.disabled = true);
      status.textContent = "Saving…";
      try {
        const r = await api("POST", { action, slug: p.slug, note: note.value.trim() });
        state = r.state || state;
        status.innerHTML = statusText(p) || "Saved.";
        if (action === "approve") box.classList.add("done");
      } catch (err) {
        status.textContent = err.auth ? "Your sign-in expired. Refresh the page and sign in again." : "That didn't save. Check your internet and try again, or tell Claude in chat.";
      }
      box.querySelectorAll("button").forEach(b => b.disabled = false);
    };
    document.getElementById("approve").addEventListener("click", () => save("approve"));
    document.getElementById("changes").addEventListener("click", () => save("changes"));
  }

  window.addEventListener("hashchange", () => key && route());
  document.getElementById("signout").addEventListener("click", e => { e.preventDefault(); store.set(""); key = ""; gate(); });
  load();
</script>
</body>
</html>
