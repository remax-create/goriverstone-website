[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Share links for posts approved in the last few minutes (before the publisher
# writes their static share page) are served by the blog function. Static files win.
[[redirects]]
  from = "/share/*"
  to = "/api/blog?share=:splat"
  status = 200

[[headers]]
  for = "/review.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Drafts are bundled into the blog function; never serve the raw files.
[[redirects]]
  from = "/drafts/*"
  to = "/404"
  status = 404
  force = true

# Short link for the "Comment BUILD" replies
[[redirects]]
  from = "/build"
  to = "/build.html"
  status = 301

# The old "Build on your land" page was merged into /build.html
[[redirects]]
  from = "/build-on-your-land.html"
  to = "/build.html"
  status = 301
  force = true

[[redirects]]
  from = "/build-on-your-land"
  to = "/build.html"
  status = 301
  force = true
